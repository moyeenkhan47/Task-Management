spring:
  application:
    name: task-management-service
  datasource:
    url: jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:my-task-export-bucket}
    region: ${AWS_REGION:us-east-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:test-access-key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}